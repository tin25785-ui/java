spring.application.name=shoptin
server.port=8080

# =========================================================================
# 1. CẤU HÌNH MYSQL (Bố cục chuẩn theo dự án MySQL của thầy):
# Khi máy có MySQL (port 3306), chỉ cần mở comment 3 dòng sau:
# spring.datasource.url=jdbc:mysql://localhost:3306/shopdb
# spring.datasource.username=root
# spring.datasource.password=123456
# =========================================================================

# =========================================================================
# 2. CẤU HÌNH SQLITE (Chạy trực tiếp không cần cài MySQL):
# =========================================================================
spring.datasource.url=jdbc:sqlite:shoptin.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.SQLiteDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
